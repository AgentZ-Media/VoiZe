name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Selbst verwalteter Signier-Schlüsselbund. Wichtig, weil das Zertifikat
      # selbstsigniert ist: Tauri löst die Identität über
      # `security find-identity -v` (nur GÜLTIGE Identitäten) auf, und dafür muss
      # das Zertifikat (a) mit privatem Schlüssel in einem durchsuchten
      # Schlüsselbund liegen und (b) fürs Code-Signing als vertrauenswürdig
      # markiert sein. tauri-action bekommt bewusst KEIN APPLE_CERTIFICATE, damit
      # es keinen eigenen Schlüsselbund anlegt und diesen hier nicht überschreibt.
      # Die find-identity-Ausgabe steht im Log, um den Zustand vor dem Build zu
      # belegen.
      - name: Set up signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/voize-cert.p12"
          PEM="$RUNNER_TEMP/voize-cert.pem"
          KC="$RUNNER_TEMP/voize-signing.keychain-db"
          KC_PASS="voize-ci-keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$P12"

          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -t 21600 "$KC"      # kein Auto-Lock während des Builds
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # codesign darf den Schlüssel ohne interaktive Nachfrage nutzen
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          # Unseren Schlüsselbund in Suchliste voranstellen und als Default setzen
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KC"
          # Öffentliches Zertifikat als vertrauenswürdigen Code-Signing-Anker
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KC" > "$PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$PEM"

          echo "=== find-identity -v -p codesigning (nur gültige) ==="
          security find-identity -v -p codesigning
          echo "=== find-identity -p codesigning (alle) ==="
          security find-identity -p codesigning

      - name: Build signed Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Nur die Identität – der Schlüsselbund wurde im Schritt zuvor
          # eingerichtet. Bewusst KEINE Notarisierung.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VoiZe ${{ github.ref_name }}"
          releaseBody: "VoiZe desktop release."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
